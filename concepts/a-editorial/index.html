        <p>태양초 고추, 우리콩, 통쌀 — 한 병에 들어갈 재료를 산지에서 직접 고릅니다.</p>

        <p>나물 무침부터 냉면, 찌개까지 — 소스 하나면 우리 집 주방의 매일이 완성됩니다.</p>
